<div class="register-container">
  <div class="register-card">
    <h1>Crear Cuenta</h1>
    
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="userData.name"
          required
          placeholder="Juan Pérez"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="userData.email"
          required
          email
          placeholder="tu@email.com"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="userData.password"
          required
          minlength="6"
          placeholder="••••••••"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="userData.confirmPassword"
          required
          minlength="6"
          placeholder="••••••••"
          class="form-control"
          [class.error]="!passwordsMatch() && userData.confirmPassword"
        />
        <small class="error-message" *ngIf="!passwordsMatch() && userData.confirmPassword">
          Las contraseñas no coinciden
        </small>
      </div>

      <app-button
        [text]="isLoading ? 'Creando cuenta...' : 'Registrarse'"
        [variant]="'primary'"
        [disabled]="!registerForm.valid || !passwordsMatch() || isLoading"
        (clicked)="onSubmit()">
      </app-button>

      <div class="login-link">
        ¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a>
      </div>
    </form>
  </div>
</div>
